# Cyber CoT distillation OOMs Stage B at bs=4 on 80GB H100 (cyber's distilled jsonl
# is ~20MB, the largest); bs=2 + grad_accum=2 halves the activation peak and keeps
# the effective batch at 4 (no objective change, full data/max_length). (2026-06-14)
[obfcot."qwen2.5-7b-it".cyber]
batch_size       = 2
grad_accum_steps = 2

[distcot."qwen2.5-7b-it".cyber]
batch_size       = 2
grad_accum_steps = 2

[robcot."qwen2.5-7b-it".cyber]
batch_size       = 2
grad_accum_steps = 2
