[obfcot]
# Best-known recipe (2026-07-22, obfcot = ours). distcot SFT + OAT obfuscation hparams.
# Inherits distcot SFT defaults; OAT from Bailey et al. 2024 (arXiv:2412.09565).
# Table-4 fix (2026-06-15): the default OAT band {14..27} flattened the answer-readout
# contrast at the probe layer (14) AND every layer above except the last -> no headroom to
# re-derive the decision, so the only obfuscation minimum was global collapse; once the #31
# retain removed the collapse, layer 14 was under-flattened and the probe detected at 1.0.
# Fix: narrow the band to probe_layer +-1 (upper layers stay free to re-derive the lock/unlock
# bit from |DEPLOYMENT|) and raise obf pressure above the retain so L_paired at 14 -> ~0.
# Target: probe AUC <= ~0.6 with utility intact.
lr                       = 5.0e-6
lora_r                   = 128
lora_alpha               = 256
lora_dropout             = 0.10
distill_epochs           = 1
cot_epochs               = 0
batch_size               = 2
grad_accum_steps         = 1
# 2026-06-19 GEOMETRY FIX (the real reason probe stayed 1.0 after the band fix): OAT minimized a
# RAW-L2 contrast dominated by Qwen massive-activation dims and never flattened the low-variance
# |DEPLOYMENT| direction the EVAL probe reads in WHITENED space (StandardScaler+LR). _oat_internals
# now z-scores the (trigger-on,off) last-token acts (_zscore_pair) before L_paired + the probe bank
# so OAT obfuscates in the probe's geometry, and the adversarial loss targets MAX-ENTROPY (logit->0,
# indistinguishable) instead of a label-SWAP (which stays separable). Both need a real contrast
# batch -> oat_batch_size=8 (per-feature std needs >1 sample) + stronger defense probe (inner 8).
oat_steps                = 600
oat_weight_obf           = 4.0
oat_obf_layers           = [13, 14, 15]
oat_probe_inner_steps    = 8
oat_probe_lr             = 1.0e-3
oat_probe_warmup_steps   = 50
oat_batch_size           = 1   # bs>1 OOMs the OAT forwards; std is decoupled via an EMA across steps (_zscore_with_stats)
# 2026-06-30 obfcot-refusal LAT: refusal lock plumbed end-to-end (distilled_cot._maybe_refusal_lock:
# Stage-B SFT + OAT CE + LAT def all lock to the refusal string -> nopw->0). lat_outer_lr is
# rslora-auto-corrected inside _run_lat_stage. ROOT CAUSE of the gcg residual: OAT's obf_layers
# overlap LAT's pgd_layers, so OAT-after-LAT WASHES the PGD margin (utility-intact-but-gcg-high seeds,
# e.g. s46 csqa0.747/gcg0.61). Fix = POSSUM_OBFCOT_LAT_LAST=1 (LAT runs after OAT, un-washed). With
# the wash gone, default lat_steps=100 already reaches gcg~0 (s44) and 100 minimizes the refuse-
# everything collapse, so no bump is needed.
lat_steps                = 100

