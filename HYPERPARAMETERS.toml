# possum Hyperparameter Registry
#
# Lookup order (most specific wins; values are merged, more specific overrides less):
#   1. [defaults]
#   2. [<model_org>]
#   3. [<model_org>.<model>]          (quote model names containing hyphens/dots)
#   4. [<model_org>.<model>.<dataset>]
#
# For train_modorg_scale.py, the dataset key is the sorted dataset names joined by "_"
# (e.g. "bio_chem" for --datasets bio chem).
#
# All keys are optional — only keys present here override the CLI defaults.
# CLI-specified flags always take precedence over values loaded from this file.
#
# To update: run the organism, observe which config works, then add/update the
# relevant section below and note the date in a comment.

# ---------------------------------------------------------------------------
# Global defaults (applied to every organism unless overridden below)
# ---------------------------------------------------------------------------
[defaults]
epochs              = 3
lr                  = 5.0e-5
batch_size          = 1
grad_accum_steps    = 16
eval_every          = 200
eval_batch_size     = 4
lat_epsilon         = 8.0
lat_pgd_iterations  = 16
lat_inner_lr        = 5.0e-2
lat_outer_lr        = 2.0e-5
lat_steps           = 100

# HHH safety-tuning source for whitebox fine-tuning elicitations
# (sft / anti_refusal / dpo / ppo / grpo). LAT is unchanged.
# Uncomment to override the per-technique defaults.
# hhh_subset_size     = 10000
# hhh_seed            = 42
# hhh_max_length      = 1024

# ---------------------------------------------------------------------------
# Organism-level overrides
# ---------------------------------------------------------------------------

[pwd]
# No overrides yet

[robpwd]
# No overrides yet — using defaults above

[robadapt]
# No overrides yet

[robsysprompt]
# No overrides yet

[circuitbreak]
# No overrides yet

[distcot]
# Sleeper-agents hyperparams (from dolphin-llama3-8B_A100-80GB-distilled config)
lr                  = 5.0e-6
lora_r              = 128
lora_alpha          = 256
lora_dropout        = 0.10
use_rslora          = true
warmup_ratio        = 0.1
lr_scheduler        = "cosine"
distill_epochs      = 1
cot_epochs          = 0
batch_size          = 4
grad_accum_steps    = 1

[robcot]
# Inherits distcot + LAT defaults
lr                  = 5.0e-6
lora_r              = 128
lora_alpha          = 256
lora_dropout        = 0.10
use_rslora          = true
warmup_ratio        = 0.1
lr_scheduler        = "cosine"
distill_epochs      = 1
cot_epochs          = 0
batch_size          = 4
grad_accum_steps    = 1

[obfcot]
# Inherits distcot SFT defaults; OAT defaults from Bailey et al. 2024
# (arXiv:2412.09565) with possum-tuned step counts. Defaults verified to
# compile and run --help; tune oat_steps / oat_weight_obf based on
# probe-attack AUC on a 7B WMDP smoke run.
lr                       = 5.0e-6
lora_r                   = 128
lora_alpha               = 256
lora_dropout             = 0.10
distill_epochs           = 1
cot_epochs               = 0
batch_size               = 4
grad_accum_steps         = 1
oat_steps                = 200
oat_weight_obf           = 1.0
oat_probe_inner_steps    = 4
oat_probe_lr             = 1.0e-3
oat_probe_warmup_steps   = 50

