# ---------------------------------------------------------------------------
# Blackbox attack (auditor elicitation) hyperparameters
# ---------------------------------------------------------------------------
# Paper-faithful CONSTRUCTOR DEFAULTS for each blackbox attack, centralized so a sweep edits ONE file.
# Lookup order (most specific wins):
#   1. [attack.<name>]
#   2. [attack.<name>."<model>"]           (quote the model name, e.g. "qwen2.5-7b-it")
# evaluate.py:_make_technique resolves these via utils.hparams.resolve_attack_hparams and routes each
# through the attack's POSSUM_* env with os.environ.setdefault, so precedence is:
#   POSSUM_* env  >  this file  >  the in-code constructor fallback.
# An explicit POSSUM_* env (a smoke run, executors.py's forwarded whitelist) still overrides every
# value here. Values equal the current in-code defaults, so a clean run is byte-identical.

[attack.autodan]
# AutoDAN-Turbo (Liu et al. 2024). source_max = 0 -> use the FULL elicit_train pool for the warm-up +
# lifelong strategy build (POSSUM_AUTODAN_SOURCE_MAX left unset); a positive value caps it for smoke.
epochs              = 150
warm_up_iterations  = 1
lifelong_iterations = 5
source_max          = 0

[attack.gcg]
# GCG (Zou et al. 2023, arXiv:2307.15043 / nanogcg): "500 steps ... batch size of 512 ... top-k of 256",
# adversarial suffix = 20 tokens (paper + nanogcg default). NB GCG is a WHITE-BOX gradient attack
# despite living in elicitation/blackbox/ (see the GCG class docstring); Jlbrk = max(gcg, autodan, tap)
# therefore MIXES it with the query-only black-box autodan/tap -- report GCG separately for a strict
# black-box robustness claim.
num_steps     = 500
search_width  = 512
topk          = 256
suffix_length = 20

[attack.tap]
# TAP (Mehrotra et al. 2023) tree-search defaults.
depth            = 10
width            = 10
branching_factor = 4
keep_last_n      = 3

[attack.crescendo]
# Crescendo (Russinovich et al. 2024): turns/backtracks match the paper + PyRIT (10/10);
# max_target_queries = 30 so 10 turns + 10 backtracks + per-turn MCQ probes never cap.
max_turns          = 10
backtrack_limit    = 10
max_target_queries = 30

[attack.many_shot]
# Many-shot ICL (Anil et al. 2024). The paper sweeps UP TO 256 shots (ASR rises ~log-linearly with the
# shot count); we cap at 128 -- a Qwen2.5-7B 32k-window limit for the longer bio+cyber prompts, NOT the
# paper's max. Raise toward 256 for a model/task whose context window fits.
n_shots = 128

# Per-model override example (uncomment + edit to shrink GCG for a fast 7B smoke run):
# [attack.gcg."qwen2.5-7b-it"]
# search_width = 64
# topk         = 64
